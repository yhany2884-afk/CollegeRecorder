<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="محاضراتي" />
<meta name="theme-color" content="#101418" />
<title>محاضراتي</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" />
<style>
  :root { color-scheme: dark; --bg:#101418; --card:#1a2027; --line:#2a313a; --text:#eef2f5; --muted:#9aa3ad; --gold:#c4a46a; --ink:#1a1408; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: "Segoe UI", Tahoma, sans-serif; }
  body { max-width: 880px; margin: 0 auto; padding: 20px 16px 96px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { font-size: 22px; margin:0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border:0; background: var(--card); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--gold); color: var(--ink); font-weight: 700; }
  button.danger { color: #e7b4b4; }
  button:disabled { opacity: .45; cursor: default; }
  .search { width:100%; background:#12171c; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .meta { color: var(--muted); font-size:12px; }
  .snip { margin-top:8px; color:#d5dde4; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .bar { position: sticky; bottom: 12px; display:flex; gap:8px; justify-content:center; }
  .rec { min-width: 140px; }
  dialog { width: min(440px, calc(100% - 24px)); background:#161b21; color:var(--text); border:1px solid var(--line); border-radius:16px; padding:16px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
  input[type=text], select, textarea { width:100%; background:#101418; border:1px solid var(--line); border-radius:10px; padding:10px; }
  textarea { min-height: 140px; resize: vertical; }
  .tabs { display:flex; gap:6px; margin: 8px 0 12px; }
  .tabs button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
  audio { width:100%; margin-top:8px; }
  .live { min-height: 48px; color:#d7e2c8; white-space: pre-wrap; }
  .notice { color:#e7c27a; font-size:13px; margin-bottom:10px; }
  .clock { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
</style>
</head>
<body>
<header>
  <div>
    <h1>محاضراتي</h1>
    <div class="sub" id="count">جاري التحميل</div>
  </div>
  <button class="primary" id="newBtn" type="button">محاضرة جديدة</button>
</header>
<div class="notice" id="notice" hidden></div>
<input class="search" id="q" type="search" placeholder="ابحث في العنوان أو المادة أو النص" />
<div id="list"></div>
<div class="bar">
  <button id="pauseBtn" type="button" disabled>إيقاف مؤقت</button>
  <button class="primary rec" id="recBtn" type="button">تسجيل</button>
  <button id="stopBtn" type="button" disabled>إنهاء</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2>محاضرة جديدة</h2>
    <label>العنوان</label>
    <input id="title" type="text" required placeholder="مثال: محاضرة 3" />
    <label>المادة</label>
    <input id="subject" type="text" placeholder="عام" />
    <label>اللغة</label>
    <select id="lang">
      <option value="ar-EG">عربي</option>
      <option value="en-US">English</option>
    </select>
    <div class="row" style="margin-top:14px; justify-content:flex-end">
      <button type="button" id="cancel">إلغاء</button>
      <button class="primary" type="submit">ابدأ</button>
    </div>
  </form>
</dialog>

<dialog id="detail">
  <div class="row" style="justify-content:space-between; align-items:center">
    <h2 id="dTitle"></h2>
    <button type="button" id="closeDetail">إغلاق</button>
  </div>
  <div class="meta" id="dMeta"></div>
  <audio id="player" controls></audio>
  <div class="tabs">
    <button type="button" data-tab="text" aria-pressed="true">النص</button>
    <button type="button" data-tab="summary">الملخص</button>
    <button type="button" data-tab="notes">ملاحظات</button>
  </div>
  <div id="textPane"></div>
  <div id="summaryPane" hidden></div>
  <textarea id="notes" hidden></textarea>
  <div class="row" style="margin-top:12px">
    <button type="button" id="saveNotes">حفظ الملاحظات</button>
    <button type="button" id="exportBtn">تصدير نص</button>
    <button class="danger" type="button" id="deleteBtn">حذف</button>
  </div>
</dialog>

<script>
const DB = "mohadarat";
const $ = (id) => document.getElementById(id);
let lectures = [];
let selected = null;
let media = null;
let chunks = [];
let recognition = null;
let finalText = "";
let recording = false;
let paused = false;
let started = 0;
let pausedMs = 0;
let pauseAt = 0;
let tick = 0;
let draft = null;
let wakeLock = null;

function fold(v) {
  return (v || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/[\u064B-\u0652]/g, "");
}
function clock(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("lectures")) db.createObjectStore("lectures", { keyPath: "id" });
      if (!db.objectStoreNames.contains("audio")) db.createObjectStore("audio");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function tx(store, mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const result = fn(t);
    t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : result);
    t.onerror = () => reject(t.error);
  });
}
function summarize(text) {
  const lines = text.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  const points = lines.filter((l) => l.length > 18).slice(0, 6);
  const summary = lines.slice(0, 3).join(" ");
  return { summary: summary || "لا يوجد نص كافٍ للتلخيص.", keyPoints: points };
}
function notice(msg) {
  const n = $("notice");
  if (!msg) { n.hidden = true; n.textContent = ""; return; }
  n.hidden = false;
  n.textContent = msg;
}
function render() {
  const q = fold($("q").value.trim());
  const rows = lectures.filter((l) => !q || fold([l.title, l.subject, l.transcript, l.summary, l.notes, ...(l.keyPoints || [])].join("\n")).includes(q));
  $("count").textContent = recording ? "تسجيل " + clock(Date.now() - started - pausedMs) : (rows.length + " محاضرة");
  $("list").innerHTML = rows.map((l) => {
    const hit = q ? (l.transcript || "").split("\n").find((line) => fold(line).includes(q)) : "";
    return `<button class="card" data-id="${l.id}" type="button" style="width:100%; text-align:right"><h2>${escapeHtml(l.title)}</h2><div class="meta">${escapeHtml(l.subject)} · ${clock(l.durationMs)} · ${new Date(l.createdAt).toLocaleString("ar")}</div>${hit ? `<div class="snip">${escapeHtml(hit)}</div>` : ""}</button>`;
  }).join("") || `<div class="card">لا توجد محاضرات بعد.</div>`;
  $("recBtn").textContent = recording ? "جاري التسجيل" : "تسجيل";
  $("recBtn").disabled = recording;
  $("pauseBtn").disabled = !recording;
  $("pauseBtn").textContent = paused ? "استئناف" : "إيقاف مؤقت";
  $("stopBtn").disabled = !recording;
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&","<":"<",">":">","\"":""","'":"&#39;" }[c]));
}
async function load() {
  const db = await openDb();
  lectures = await new Promise((resolve, reject) => {
    const req = db.transaction("lectures").objectStore("lectures").getAll();
    req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.createdAt - a.createdAt));
    req.onerror = () => reject(req.error);
  });
  render();
}
function speechCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function bindSpeech(lang) {
  const Ctor = speechCtor();
  if (!Ctor) { notice("التحويل لنص غير متاح في هذا المتصفح. الصوت هيتسجل برضه."); return; }
  const rec = new Ctor();
  rec.lang = lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const text = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += (finalText ? "\n" : "") + text.trim();
      else interim += text;
    }
    const live = document.querySelector(".live");
    if (live) live.textContent = (finalText + (interim ? "\n" + interim : "")).trim();
  };
  rec.onerror = (ev) => { if (ev.error !== "no-speech" && ev.error !== "aborted") notice("التعرّف على الكلام: " + ev.error); };
  rec.onend = () => { if (recording && !paused) { try { rec.start(); } catch (e) {} } };
  recognition = rec;
  try { rec.start(); } catch (e) { notice("تعذر بدء تحويل الكلام."); }
}
async function startRec() {
  notice("");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  finalText = "";
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
  media = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  media.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  media.start(1000);
  recording = true;
  paused = false;
  started = Date.now();
  pausedMs = 0;
  tick = setInterval(render, 250);
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  bindSpeech(draft.language);
  render();
  const card = document.createElement("div");
  card.className = "card";
  card.id = "liveCard";
  card.innerHTML = `<h2>${escapeHtml(draft.title)}</h2><div class="meta">${escapeHtml(draft.subject)}</div><div class="live"></div>`;
  $("list").prepend(card);
}
async function togglePause() {
  if (!media) return;
  if (!paused) {
    if (media.state === "recording") media.pause();
    paused = true;
    pauseAt = Date.now();
    try { recognition && recognition.stop(); } catch (e) {}
  } else {
    pausedMs += Date.now() - pauseAt;
    if (media.state === "paused") media.resume();
    paused = false;
    bindSpeech(draft.language);
  }
  render();
}
async function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(tick);
  try { recognition && recognition.stop(); } catch (e) {}
  try { wakeLock && wakeLock.release(); } catch (e) {}
  const blob = await new Promise((resolve) => {
    media.onstop = () => {
      media.stream.getTracks().forEach((t) => t.stop());
      resolve(new Blob(chunks, { type: media.mimeType || "audio/webm" }));
    };
    if (media.state !== "inactive") media.stop();
    else resolve(new Blob(chunks, { type: "audio/webm" }));
  });
  const text = finalText.trim();
  const sum = summarize(text);
  const lecture = {
    id: crypto.randomUUID(),
    title: draft.title,
    subject: draft.subject || "عام",
    language: draft.language,
    createdAt: Date.now(),
    durationMs: Date.now() - started - pausedMs,
    transcript: text,
    summary: sum.summary,
    keyPoints: sum.keyPoints,
    notes: "",
  };
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const t = db.transaction(["lectures", "audio"], "readwrite");
    t.objectStore("lectures").put(lecture);
    t.objectStore("audio").put(blob, lecture.id);
    t.oncomplete = resolve;
    t.onerror = () => reject(t.error);
  });
  draft = null;
  media = null;
  await load();
}
async function openDetail(id) {
  selected = lectures.find((l) => l.id === id);
  if (!selected) return;
  $("dTitle").textContent = selected.title;
  $("dMeta").textContent = selected.subject + " · " + clock(selected.durationMs);
  $("textPane").innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(selected.transcript || "لم يُلتقط نص. الصوت محفوظ.")}</div>`;
  const points = (selected.keyPoints || []).map((p) => `<li>${escapeHtml(p)}</li>`).join("");
  $("summaryPane").innerHTML = `<p>${escapeHtml(selected.summary || "")}</p><ul>${points}</ul>`;
  $("notes").value = selected.notes || "";
  showTab("text");
  const db = await openDb();
  const audio = await new Promise((resolve) => {
    const req = db.transaction("audio").objectStore("audio").get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
  if (audio) $("player").src = URL.createObjectURL(audio);
  else $("player").removeAttribute("src");
  $("detail").showModal();
}
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === name)));
  $("textPane").hidden = name !== "text";
  $("summaryPane").hidden = name !== "summary";
  $("notes").hidden = name !== "notes";
}
$("newBtn").onclick = () => $("dlg").showModal();
$("cancel").onclick = () => $("dlg").close();
$("form").onsubmit = async (e) => {
  e.preventDefault();
  draft = { title: $("title").value.trim() || "محاضرة", subject: $("subject").value.trim() || "عام", language: $("lang").value };
  $("dlg").close();
  try { await startRec(); }
  catch (err) { notice("اسمح للميكروفون عشان التسجيل يبدأ."); recording = false; render(); }
};
$("pauseBtn").onclick = () => togglePause();
$("stopBtn").onclick = () => stopRec();
$("q").oninput = () => render();
$("list").onclick = (e) => {
  const btn = e.target.closest("[data-id]");
  if (btn) openDetail(btn.dataset.id);
};
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
$("closeDetail").onclick = () => $("detail").close();
$("saveNotes").onclick = async () => {
  if (!selected) return;
  selected.notes = $("notes").value;
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const t = db.transaction("lectures", "readwrite");
    t.objectStore("lectures").put(selected);
    t.oncomplete = resolve;
    t.onerror = () => reject(t.error);
  });
  await load();
  notice("اتحفظت الملاحظات.");
};
$("exportBtn").onclick = () => {
  if (!selected) return;
  const body = selected.title + "\n" + selected.subject + "\n\n" + (selected.transcript || "") + "\n\n" + (selected.summary || "") + "\n\n" + (selected.notes || "");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "text/plain;charset=utf-8" }));
  a.download = selected.title.replace(/\s+/g, "-") + ".txt";
  a.click();
};
$("deleteBtn").onclick = async () => {
  if (!selected || !confirm("حذف المحاضرة؟")) return;
  const id = selected.id;
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const t = db.transaction(["lectures", "audio"], "readwrite");
    t.objectStore("lectures").delete(id);
    t.objectStore("audio").delete(id);
    t.oncomplete = resolve;
    t.onerror = () => reject(t.error);
  });
  $("detail").close();
  selected = null;
  await load();
};
if (location.protocol === "https:" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
load().catch(() => notice("تعذر فتح الحفظ المحلي."));
</script>
</body>
</html>
